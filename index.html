<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Window2Kochi - WebAR Experience</title>

  <!-- Strict Baseline Constraints: A-Frame v1.4.2, MindAR v1.2.5, aframe-extras v7.2.0 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent !important;
    }

    /* Container for MindAR camera feed & WebGL scene */
    .example-container {
      overflow: hidden;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    /* Ensure camera video is visible directly behind the transparent WebGL canvas */
    video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .a-canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
    }

    /* Mobile Debug Console Overlay */
    #mobile-debug-console {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      max-height: 25vh;
      background: rgba(0, 0, 0, 0.85);
      color: #00ff66;
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.4;
      z-index: 999999;
      overflow-y: auto;
      padding: 8px 12px;
      pointer-events: auto;
      box-sizing: border-box;
      border-bottom: 2px solid rgba(0, 255, 102, 0.4);
      transition: max-height 0.2s ease;
    }

    #mobile-debug-console.minimized {
      max-height: 26px;
      overflow: hidden;
    }

    .debug-error {
      color: #ff4d4d;
      font-weight: bold;
    }

    .debug-warn {
      color: #ffaa00;
    }

    /* UI Overlay */
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px; /* clearance for debug header */
      pointer-events: auto;
      gap: 8px;
    }

    .badge {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.15);
      white-space: nowrap;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s, border-color 0.2s;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn.active-mode {
      border-color: #00ffff;
      background: rgba(0, 255, 255, 0.2);
      color: #00ffff;
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .status-card.detected {
      background: rgba(46, 204, 113, 0.85);
      border-color: rgba(46, 204, 113, 0.4);
    }
  </style>

  <script>
    // iOS WebKit stream watchdog: automatically calls play() on stream attachment to prevent camera stall
    const mediaProto = HTMLMediaElement.prototype;
    const srcObjectDesc = Object.getOwnPropertyDescriptor(mediaProto, 'srcObject') ||
                          Object.getOwnPropertyDescriptor(HTMLVideoElement.prototype, 'srcObject');

    if (srcObjectDesc && srcObjectDesc.set) {
      const origSet = srcObjectDesc.set;
      Object.defineProperty(mediaProto, 'srcObject', {
        set(stream) {
          origSet.call(this, stream);
          if (stream && this.tagName === 'VIDEO') {
            this.setAttribute('playsinline', '');
            this.setAttribute('webkit-playsinline', '');
            this.playsInline = true;
            this.muted = true;
            this.play().catch(() => {});
          }
        },
        get() {
          return srcObjectDesc.get.call(this);
        }
      });
    }

    // Fallback for devices without environment camera (desktop webcam fallback)
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const origGUM = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = async function (constraints) {
        try {
          return await origGUM(constraints);
        } catch (err) {
          try {
            return await origGUM({ video: true, audio: false });
          } catch (fallbackErr) {
            throw fallbackErr;
          }
        }
      };
    }

    // ==========================================
    // 1. Custom Chroma-Key Shader Component
    // ==========================================
    AFRAME.registerShader('chromakey', {
      schema: {
        src: { type: 'map', is: 'uniform' },
        color: { type: 'color', default: '#00ff00', is: 'uniform' },
        threshold: { type: 'number', default: 0.38, is: 'uniform' },
        smoothness: { type: 'number', default: 0.1, is: 'uniform' }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision mediump float;
        uniform sampler2D src;
        uniform vec3 color;
        uniform float threshold;
        uniform float smoothness;
        varying vec2 vUv;

        // RGB to YCbCr conversion
        vec3 rgb2ycbcr(vec3 c) {
          float y  =  0.2989 * c.r + 0.5866 * c.g + 0.1145 * c.b;
          float cb = -0.1687 * c.r - 0.3313 * c.g + 0.5000 * c.b;
          float cr =  0.5000 * c.r - 0.4187 * c.g - 0.0813 * c.b;
          return vec3(y, cb, cr);
        }

        void main() {
          vec4 texColor = texture2D(src, vUv);
          vec3 keyYCC = rgb2ycbcr(color);
          vec3 texYCC = rgb2ycbcr(texColor.rgb);

          // Calculate chrominance distance in Cb/Cr space
          float diff = distance(texYCC.yz, keyYCC.yz);
          float mask = smoothstep(threshold, threshold + smoothness, diff);

          // Green spill suppression: clamp excess green to max(red, blue)
          vec3 cleanColor = texColor.rgb;
          float maxRB = max(cleanColor.r, cleanColor.b);
          if (cleanColor.g > maxRB) {
            cleanColor.g = mix(maxRB, cleanColor.g, mask);
          }

          if (mask < 0.01) {
            discard;
          }

          gl_FragColor = vec4(cleanColor, texColor.a * mask);
        }
      `
    });

    // ==========================================
    // 2. Custom Y-Axis Billboard Component
    // ==========================================
    AFRAME.registerComponent('y-billboard', {
      init: function () {
        this.camWorldPos = new THREE.Vector3();
        this.camLocalPos = new THREE.Vector3();
      },
      tick: function () {
        const camera = this.el.sceneEl.camera;
        if (!camera) return;
        const parent = this.el.object3D.parent;
        if (!parent) return;

        // Camera world position converted to target/group coordinate space
        camera.getWorldPosition(this.camWorldPos);
        this.camLocalPos.copy(this.camWorldPos);
        parent.worldToLocal(this.camLocalPos);

        // Horizontal camera delta relative to plane position (x=0, y=0)
        const dx = this.camLocalPos.x - this.el.object3D.position.x;
        const dy = this.camLocalPos.y - this.el.object3D.position.y;
        const targetAngle = Math.atan2(dx, -dy);

        // Subtly rotate around local Y/up axis while staying perpendicular to the book cover
        if (!isNaN(targetAngle)) {
          const clampedAngle = Math.max(-0.55, Math.min(0.55, targetAngle));
          this.el.object3D.rotation.y = clampedAngle;
        }
      }
    });
  </script>
</head>

<body>
  <!-- Mobile Debug Console Overlay & Error Logger -->
  <div id="mobile-debug-console" title="Tap to expand/collapse">
    <div style="font-size: 10px; color: #888; margin-bottom: 4px;">[Debug Console - tap to toggle]</div>
  </div>

  <script>
    (function () {
      const debugConsole = document.getElementById('mobile-debug-console');
      debugConsole.addEventListener('click', () => {
        debugConsole.classList.toggle('minimized');
      });

      function printToScreen(msg, type = '') {
        const logLine = document.createElement('div');
        let output = (typeof msg === 'object' && msg !== null) ? (msg.stack || JSON.stringify(msg)) : String(msg);
        logLine.textContent = `> ${output}`;
        if (type === 'error') logLine.className = 'debug-error';
        if (type === 'warn') logLine.className = 'debug-warn';
        debugConsole.appendChild(logLine);
        debugConsole.scrollTop = debugConsole.scrollHeight;
      }

      const originalError = console.error;
      console.error = function (...args) { printToScreen(args.join(' '), 'error'); originalError.apply(console, args); };
      const originalLog = console.log;
      console.log = function (...args) { printToScreen(args.join(' ')); originalLog.apply(console, args); };
      const originalWarn = console.warn;
      console.warn = function (...args) { printToScreen(args.join(' '), 'warn'); originalWarn.apply(console, args); };

      window.onerror = function (m, s, l) { printToScreen(`CRASH: ${m} at line ${l}`, 'error'); return false; };
      window.addEventListener('unhandledrejection', e => printToScreen(`PROMISE FAIL: ${e.reason}`, 'error'));
    })();
  </script>

  <!-- UI Overlay -->
  <div id="ui-container">
    <div class="top-bar">
      <div class="badge">Window2Kochi AR</div>
      <div style="display: flex; gap: 8px;">
        <button id="modeToggle" class="action-btn active-mode" title="Toggle 2.5D Video vs 3D GLB">Mode: 2.5D Video</button>
        <button id="soundToggle" class="action-btn" title="Toggle Sound">🔊</button>
      </div>
    </div>
    <div class="bottom-bar">
      <div id="statusMessage" class="status-card">Point camera at target image</div>
    </div>
  </div>

  <!-- MindAR Container Wrapper -->
  <div class="example-container">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- Assets Preloading with timeout 15000 -->
      <a-assets timeout="15000">
        <video id="popoutVideo" src="./popout.mp4" preload="auto" loop="true" playsinline webkit-playsinline muted crossorigin="anonymous"></video>
        <audio id="coverAudio" src="./cover.mp3" preload="auto"></audio>
        <a-asset-item id="ninaModel" src="./nina.glb"></a-asset-item>
      </a-assets>

      <!-- Scene Lighting -->
      <a-light type="ambient" intensity="1.2"></a-light>
      <a-light type="directional" intensity="1.5" position="1 2 2"></a-light>

      <!-- AR Camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Tracked Target 0 -->
      <a-entity id="arTarget" mindar-image-target="targetIndex: 0">

        <!-- 1. 2.5D Chroma-Key Video Group (Visible by default) -->
        <a-entity
          id="videoGroup"
          scale="0.001 0.001 0.001"
          animation__pop="property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 850; easing: easeOutElastic; startEvents: popOut">

          <!-- Glowing Cyan Base Ring (Depth Anchor) -->
          <a-ring
            position="0 0 0.01"
            rotation="0 0 0"
            radius-inner="0.32"
            radius-outer="0.38"
            color="#00ffff"
            material="shader: flat; transparent: true; opacity: 0.8; side: double;"
            animation__scale="property: scale; from: 0.94 0.94 1; to: 1.06 1.06 1; dur: 1200; dir: alternate; loop: true; easing: easeInOutSine"
            animation__op="property: material.opacity; from: 0.5; to: 0.95; dur: 1200; dir: alternate; loop: true; easing: easeInOutSine">
          </a-ring>

          <!-- Green-Screen Character Plane -->
          <a-plane
            id="videoPlane"
            position="0 0 0.6"
            rotation="90 0 0"
            width="1.2"
            height="1.2"
            material="shader: chromakey; src: #popoutVideo; color: #00ff00; transparent: true; depthWrite: false; side: double;"
            y-billboard>
          </a-plane>
        </a-entity>

        <!-- 2. 3D Rigged GLB Model Group (Hidden initially) -->
        <a-entity
          id="glbGroup"
          visible="false"
          scale="0.001 0.001 0.001"
          animation__pop="property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 850; easing: easeOutElastic; startEvents: popOut">

          <a-gltf-model
            id="ninaEntity"
            src="#ninaModel"
            position="0 0 0"
            rotation="90 0 0"
            scale="0.5 0.5 0.5"
            animation-mixer="clip: *; loop: repeat; timeScale: 0">
          </a-gltf-model>
        </a-entity>

      </a-entity>
    </a-scene>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("a-scene");
      const targetEntity = document.querySelector("#arTarget");
      const videoGroup = document.querySelector("#videoGroup");
      const glbGroup = document.querySelector("#glbGroup");
      const ninaEntity = document.querySelector("#ninaEntity");
      const popoutVideo = document.querySelector("#popoutVideo");
      const coverAudio = document.querySelector("#coverAudio");
      const statusMessage = document.querySelector("#statusMessage");
      const soundBtn = document.querySelector("#soundToggle");
      const modeBtn = document.querySelector("#modeToggle");

      let currentMode = "video"; // "video" | "glb"
      let soundEnabled = true;
      let audioUnlocked = false;
      let isTargetDetected = false;

      // ==========================================
      // Nina GLB Animation Sequence (Hello_Run -> Cheer_with_Both_Hands_1)
      // ==========================================
      function startNinaAnimation() {
        ninaEntity.setAttribute("animation-mixer", "clip: Hello_Run; loop: once; clampWhenFinished: true; timeScale: 1");
      }

      ninaEntity.addEventListener("animation-finished", () => {
        if (isTargetDetected && currentMode === "glb") {
          ninaEntity.setAttribute("animation-mixer", "clip: Cheer_with_Both_Hands_1; loop: repeat; timeScale: 1");
        }
      });

      // ==========================================
      // Mobile Media Unlocking (Audio & Video)
      // ==========================================
      function unlockMedia() {
        if (audioUnlocked) return;
        audioUnlocked = true;

        window.removeEventListener("click", unlockMedia);
        window.removeEventListener("touchstart", unlockMedia);

        // Mute coverAudio before priming play() so no sound leaks before target detection
        coverAudio.muted = true;
        const audioPromise = coverAudio.play();
        if (audioPromise !== undefined) {
          audioPromise.then(() => {
            coverAudio.pause();
            coverAudio.currentTime = 0;
            // Restore unmuted state so it can play aloud when target is detected
            coverAudio.muted = false;
            console.log("Audio primed successfully!");

            // If target was already detected before user tapped, start audio now
            if (isTargetDetected && soundEnabled) {
              coverAudio.play().catch(err => console.warn("coverAudio play blocked:", err));
            }
          }).catch(err => {
            console.warn("Audio unlock pending user interaction:", err);
            audioUnlocked = false;
            coverAudio.muted = false;
          });
        }

        // Keep popoutVideo muted so it never doubles coverAudio
        popoutVideo.muted = true;
        const videoPromise = popoutVideo.play();
        if (videoPromise !== undefined) {
          videoPromise.then(() => {
            if (!isTargetDetected || currentMode !== "video") {
              popoutVideo.pause();
              popoutVideo.currentTime = 0;
            }
          }).catch(() => {});
        }
      }

      window.addEventListener("click", unlockMedia, { passive: true });
      window.addEventListener("touchstart", unlockMedia, { passive: true });

      // ==========================================
      // Sound Toggle
      // ==========================================
      soundBtn.addEventListener("click", () => {
        unlockMedia();
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
        if (!soundEnabled) {
          coverAudio.pause();
        } else if (isTargetDetected) {
          coverAudio.currentTime = 0;
          coverAudio.play().catch(e => console.warn("Audio play blocked:", e));
        }
      });

      // ==========================================
      // Live UI Mode Switcher (2.5D Video vs 3D GLB)
      // ==========================================
      modeBtn.addEventListener("click", () => {
        unlockMedia();
        if (currentMode === "video") {
          currentMode = "glb";
          modeBtn.textContent = "Mode: 3D GLB";
          modeBtn.classList.remove("active-mode");
          videoGroup.setAttribute("visible", "false");
          glbGroup.setAttribute("visible", "true");
          popoutVideo.pause();

          if (isTargetDetected) {
            glbGroup.emit("popOut");
            startNinaAnimation();
          }
          console.log("Switched to 3D GLB mode");
        } else {
          currentMode = "video";
          modeBtn.textContent = "Mode: 2.5D Video";
          modeBtn.classList.add("active-mode");
          glbGroup.setAttribute("visible", "false");
          videoGroup.setAttribute("visible", "true");
          ninaEntity.setAttribute("animation-mixer", "clip: Hello_Run; loop: once; timeScale: 0");

          if (isTargetDetected) {
            videoGroup.emit("popOut");
            popoutVideo.currentTime = 0;
            popoutVideo.play().catch(e => console.warn("Video play error:", e));
          }
          console.log("Switched to 2.5D Video mode");
        }
      });

      // ==========================================
      // Model & Engine Watchers
      // ==========================================
      ninaEntity.addEventListener("model-loaded", (e) => {
        console.log("3D Model nina.glb loaded successfully!");
        const model = e.detail.model;
        if (model && model.animations && model.animations.length > 0) {
          const clipList = model.animations.map((clip, i) => `[${i}] "${clip.name}"`).join(", ");
          console.log(`Available animations (${model.animations.length}): ${clipList}`);
        }
      });

      ninaEntity.addEventListener("model-error", (e) => {
        console.error("model-error loading nina.glb:", JSON.stringify(e.detail || e));
      });

      sceneEl.addEventListener("renderstart", () => {
        console.log("A-Frame scene render started");
      });

      sceneEl.addEventListener("arReady", () => {
        console.log("MindAR engine ready: Camera & tracking online!");
      });

      sceneEl.addEventListener("arError", (event) => {
        console.error("MindAR arError:", JSON.stringify(event.detail || event));
      });

      // ==========================================
      // Target Found Event
      // ==========================================
      targetEntity.addEventListener("targetFound", () => {
        isTargetDetected = true;
        console.log("Target 0 detected!");
        statusMessage.textContent = "Target detected!";
        statusMessage.classList.add("detected");

        // Synchronize and play popoutVideo (kept muted to avoid audio doubling)
        if (currentMode === "video") {
          popoutVideo.currentTime = 0;
          popoutVideo.play().then(() => {
            console.log("popout.mp4 playing with chromakey shader");
          }).catch(err => {
            console.warn("popoutVideo play error:", err);
          });
        }

        // Synchronize coverAudio as primary soundtrack
        if (soundEnabled) {
          coverAudio.currentTime = 0;
          coverAudio.play().then(() => {
            console.log("coverAudio playing");
          }).catch((err) => {
            console.warn("coverAudio play blocked; tap screen to unlock:", err);
          });
        }

        // Trigger pop-out spring on active group
        if (currentMode === "video") {
          videoGroup.emit("popOut");
        } else {
          glbGroup.emit("popOut");
          startNinaAnimation();
        }
      });

      // ==========================================
      // Target Lost Event
      // ==========================================
      targetEntity.addEventListener("targetLost", () => {
        isTargetDetected = false;
        console.log("Target 0 lost");
        statusMessage.textContent = "Point camera at target image";
        statusMessage.classList.remove("detected");

        // Pause media
        popoutVideo.pause();
        coverAudio.pause();

        // Reset scales to 0.001 0.001 0.001 for fresh pop-out next time
        videoGroup.setAttribute("scale", "0.001 0.001 0.001");
        glbGroup.setAttribute("scale", "0.001 0.001 0.001");
        ninaEntity.setAttribute("animation-mixer", "clip: Hello_Run; loop: once; timeScale: 0");
      });
    });
  </script>
</body>

</html>
