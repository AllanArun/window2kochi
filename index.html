<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Window2Kochi - WebAR Experience</title>

  <!-- Strict Constraints: A-Frame v1.4.2, MindAR v1.2.5, and aframe-extras v7.2.0 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent !important;
    }

    /* Container for MindAR camera feed & WebGL scene */
    .example-container {
      overflow: hidden;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    /* Ensure video is visible directly behind the transparent WebGL canvas */
    video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .a-canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
    }

    /* Mobile Debug Console Overlay */
    #mobile-debug-console {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      max-height: 25vh;
      background: rgba(0, 0, 0, 0.85);
      color: #00ff66;
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.4;
      z-index: 999999;
      overflow-y: auto;
      padding: 8px 12px;
      pointer-events: auto;
      box-sizing: border-box;
      border-bottom: 2px solid rgba(0, 255, 102, 0.4);
      transition: max-height 0.2s ease;
    }

    #mobile-debug-console.minimized {
      max-height: 26px;
      overflow: hidden;
    }

    .debug-error {
      color: #ff4d4d;
      font-weight: bold;
    }

    .debug-warn {
      color: #ffaa00;
    }

    /* UI Overlay */
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px; /* clearance for debug header */
      pointer-events: auto;
      gap: 8px;
    }

    .badge {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.15);
      white-space: nowrap;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn.unlocked {
      border-color: rgba(46, 204, 113, 0.6);
      background: rgba(46, 204, 113, 0.2);
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .status-card.detected {
      background: rgba(46, 204, 113, 0.85);
      border-color: rgba(46, 204, 113, 0.4);
    }
  </style>

  <script>
    // iOS WebKit watchdog: automatically calls play() on stream attachment to prevent stall
    const mediaProto = HTMLMediaElement.prototype;
    const srcObjectDesc = Object.getOwnPropertyDescriptor(mediaProto, 'srcObject') ||
                          Object.getOwnPropertyDescriptor(HTMLVideoElement.prototype, 'srcObject');

    if (srcObjectDesc && srcObjectDesc.set) {
      const origSet = srcObjectDesc.set;
      Object.defineProperty(mediaProto, 'srcObject', {
        set(stream) {
          origSet.call(this, stream);
          if (stream && this.tagName === 'VIDEO') {
            this.setAttribute('playsinline', '');
            this.setAttribute('webkit-playsinline', '');
            this.playsInline = true;
            this.muted = true;
            this.play().catch(() => {});
          }
        },
        get() {
          return srcObjectDesc.get.call(this);
        }
      });
    }

    // Fallback for devices without environment camera (desktop webcam fallback)
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const origGUM = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = async function (constraints) {
        try {
          return await origGUM(constraints);
        } catch (err) {
          try {
            return await origGUM({ video: true, audio: false });
          } catch (fallbackErr) {
            throw fallbackErr;
          }
        }
      };
    }
  </script>
</head>

<body>
  <!-- Mobile Debug Console Overlay & Error-Catching Script -->
  <div id="mobile-debug-console" title="Tap to expand/collapse">
    <div style="font-size: 10px; color: #888; margin-bottom: 4px;">[Debug Console - tap to toggle]</div>
  </div>

  <script>
    (function () {
      const debugConsole = document.getElementById('mobile-debug-console');
      debugConsole.addEventListener('click', () => {
        debugConsole.classList.toggle('minimized');
      });

      function printToScreen(msg, type = '') {
        const logLine = document.createElement('div');
        let output = (typeof msg === 'object' && msg !== null) ? (msg.stack || JSON.stringify(msg)) : String(msg);
        logLine.textContent = `> ${output}`;
        if (type === 'error') logLine.className = 'debug-error';
        if (type === 'warn') logLine.className = 'debug-warn';
        debugConsole.appendChild(logLine);
        debugConsole.scrollTop = debugConsole.scrollHeight;
      }

      const originalError = console.error;
      console.error = function (...args) { printToScreen(args.join(' '), 'error'); originalError.apply(console, args); };
      const originalLog = console.log;
      console.log = function (...args) { printToScreen(args.join(' ')); originalLog.apply(console, args); };
      const originalWarn = console.warn;
      console.warn = function (...args) { printToScreen(args.join(' '), 'warn'); originalWarn.apply(console, args); };

      window.onerror = function (m, s, l) { printToScreen(`CRASH: ${m} at line ${l}`, 'error'); return false; };
      window.addEventListener('unhandledrejection', e => printToScreen(`PROMISE FAIL: ${e.reason}`, 'error'));
    })();
  </script>

  <!-- UI Overlay -->
  <div id="ui-container">
    <div class="top-bar">
      <div class="badge">Window2Kochi AR</div>
      <div style="display: flex; gap: 8px;">
        <button id="audioUnlockBtn" class="action-btn" title="Tap to Start AR & Sound">🎵 Tap to Start AR & Sound</button>
        <button id="soundToggle" class="action-btn" title="Toggle Sound">🔊</button>
      </div>
    </div>
    <div class="bottom-bar">
      <div id="statusMessage" class="status-card">Point camera at target image</div>
    </div>
  </div>

  <!-- MindAR Container Wrapper -->
  <div class="example-container">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- Assets Preloading with timeout 15000 -->
      <a-assets timeout="15000">
        <a-asset-item id="ninaModel" src="./nina.glb"></a-asset-item>
        <audio id="coverAudio" src="./cover.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Scene Lighting -->
      <a-light type="ambient" intensity="1.2"></a-light>
      <a-light type="directional" intensity="1.5" position="1 2 2"></a-light>

      <!-- AR Camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Tracked Target 0 -->
      <a-entity id="arTarget" mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="ninaEntity"
          src="#ninaModel"
          position="0 0 0"
          rotation="90 0 0"
          scale="0.001 0.001 0.001"
          animation-mixer="clip: *; loop: repeat; timeScale: 0"
          animation__pop="property: scale; from: 0.001 0.001 0.001; to: 0.5 0.5 0.5; dur: 800; easing: easeOutElastic; startEvents: popOut">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("a-scene");
      const targetEntity = document.querySelector("#arTarget");
      const ninaEntity = document.querySelector("#ninaEntity");
      const coverAudio = document.querySelector("#coverAudio");
      const statusMessage = document.querySelector("#statusMessage");
      const soundBtn = document.querySelector("#soundToggle");
      const audioUnlockBtn = document.querySelector("#audioUnlockBtn");

      let soundEnabled = true;
      let audioUnlocked = false;

      // 1. Mobile Audio Unlock Logic (required by mobile browsers to allow unmuted audio)
      function unlockAudio() {
        if (!audioUnlocked) {
          coverAudio.play().then(() => {
            coverAudio.pause();
            coverAudio.currentTime = 0;
            audioUnlocked = true;
            console.log("Audio unlocked successfully!");
            audioUnlockBtn.textContent = "🎵 Sound Active";
            audioUnlockBtn.classList.add("unlocked");
          }).catch(err => {
            console.warn("Audio unlock pending gesture:", err);
          });
        }
      }

      audioUnlockBtn.addEventListener("click", () => {
        unlockAudio();
      });

      soundBtn.addEventListener("click", () => {
        unlockAudio();
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
        if (!soundEnabled) {
          coverAudio.pause();
        } else if (targetEntity.object3D && targetEntity.object3D.visible) {
          coverAudio.play().catch(e => console.warn("Audio play blocked:", e));
        }
      });

      // 2. 3D Model Load & Error Listeners
      ninaEntity.addEventListener("model-loaded", (e) => {
        console.log("3D Model nina.glb loaded successfully!");
        const model = e.detail.model;
        if (model && model.animations && model.animations.length > 0) {
          const clipList = model.animations.map((clip, i) => `[${i}] "${clip.name}"`).join(", ");
          console.log(`Available animation clips (${model.animations.length}): ${clipList}`);
        } else {
          console.log("No animation clips found in nina.glb");
        }
      });

      ninaEntity.addEventListener("model-error", (e) => {
        console.error("model-error loading nina.glb:", JSON.stringify(e.detail || e));
      });

      // 3. MindAR Engine Lifecycle Watchers
      sceneEl.addEventListener("renderstart", () => {
        console.log("A-Frame scene render started");
      });

      sceneEl.addEventListener("arReady", () => {
        console.log("MindAR engine ready: Camera & tracking online!");
      });

      sceneEl.addEventListener("arError", (event) => {
        console.error("MindAR arError:", JSON.stringify(event.detail || event));
      });

      // 4. Target Found Event
      targetEntity.addEventListener("targetFound", () => {
        console.log("Target 0 detected!");
        statusMessage.textContent = "Target detected!";
        statusMessage.classList.add("detected");

        // Emit popOut event on ninaEntity to trigger scale pop-out spring animation
        ninaEntity.emit("popOut");

        // Unpause rig animation
        ninaEntity.setAttribute("animation-mixer", "clip: *; loop: repeat; timeScale: 1");

        // Synchronized Audio Playback
        if (soundEnabled) {
          coverAudio.currentTime = 0;
          coverAudio.play().catch((err) => {
            console.warn("Autoplay blocked. Tap 'Tap to Start AR & Sound' to enable audio:", err);
          });
        }
      });

      // 5. Target Lost Event
      targetEntity.addEventListener("targetLost", () => {
        console.log("Target 0 lost");
        statusMessage.textContent = "Point camera at target image";
        statusMessage.classList.remove("detected");

        // Pause audio
        coverAudio.pause();

        // Reset scale back to 0.001 0.001 0.001 and timeScale to 0 for fresh pop-out next time
        ninaEntity.setAttribute("scale", "0.001 0.001 0.001");
        ninaEntity.setAttribute("animation-mixer", "clip: *; loop: repeat; timeScale: 0");
      });
    });
  </script>
</body>

</html>
