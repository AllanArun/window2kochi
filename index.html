<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Window2Kochi - WebAR Experience</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
    }

    /* Container for MindAR camera feed & WebGL scene */
    .example-container {
      overflow: hidden;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    /* Ensure video is visible directly behind the transparent WebGL canvas */
    video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .a-canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
    }

    /* UI Overlay */
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .badge {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .sound-btn, .cam-btn {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .status-card.detected {
      background: rgba(46, 204, 113, 0.85);
      border-color: rgba(46, 204, 113, 0.4);
    }
  </style>

  <script>
    // Fallback for devices without environment/back camera (e.g. desktop laptops)
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const origGUM = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = async function (constraints) {
        try {
          return await origGUM(constraints);
        } catch (err) {
          try {
            return await origGUM({ video: true, audio: false });
          } catch (fallbackErr) {
            throw fallbackErr;
          }
        }
      };
    }

    // iOS WebKit watchdog: automatically calls play() on stream attachment to prevent stall
    const mediaProto = HTMLMediaElement.prototype;
    const srcObjectDesc = Object.getOwnPropertyDescriptor(mediaProto, 'srcObject') ||
                          Object.getOwnPropertyDescriptor(HTMLVideoElement.prototype, 'srcObject');

    if (srcObjectDesc && srcObjectDesc.set) {
      const origSet = srcObjectDesc.set;
      Object.defineProperty(mediaProto, 'srcObject', {
        set(stream) {
          origSet.call(this, stream);
          if (stream && this.tagName === 'VIDEO') {
            this.setAttribute('playsinline', '');
            this.setAttribute('webkit-playsinline', '');
            this.playsInline = true;
            this.muted = true;
            this.play().catch(() => {});
          }
        },
        get() {
          return srcObjectDesc.get.call(this);
        }
      });
    }
  </script>

  <!-- A-Frame and MindAR Libraries -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <!-- UI Overlay -->
  <div id="ui-container">
    <div class="top-bar">
      <div class="badge">Window2Kochi AR</div>
      <div style="display: flex; gap: 8px;">
        <button id="camRetry" class="cam-btn" title="Retry Camera">📷 Restart</button>
        <button id="soundToggle" class="sound-btn" title="Toggle Sound">🔊</button>
      </div>
    </div>
    <div class="bottom-bar">
      <div id="statusMessage" class="status-card">Point camera at target image</div>
    </div>
  </div>

  <!-- MindAR container wrapper -->
  <div class="example-container">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="arTarget" mindar-image-target="targetIndex: 0">
        <a-box position="0 0 0.1" scale="0.5 0.5 0.5" color="red"></a-box>
      </a-entity>
    </a-scene>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("a-scene");
      const targetEntity = document.querySelector("#arTarget");
      const statusMessage = document.querySelector("#statusMessage");
      const soundBtn = document.querySelector("#soundToggle");
      const camRetryBtn = document.querySelector("#camRetry");
      let audioEnabled = true;

      // Manual camera restart button (user gesture trigger for strict mobile browser policies)
      camRetryBtn.addEventListener("click", () => {
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) {
          if (arSystem.video) {
            arSystem.video.play().catch(() => {});
          } else {
            arSystem.start();
          }
        }
      });

      soundBtn.addEventListener("click", () => {
        audioEnabled = !audioEnabled;
        soundBtn.textContent = audioEnabled ? "🔊" : "🔇";
      });

      targetEntity.addEventListener("targetFound", () => {
        statusMessage.textContent = "Target detected!";
        statusMessage.classList.add("detected");
      });

      targetEntity.addEventListener("targetLost", () => {
        statusMessage.textContent = "Point camera at target image";
        statusMessage.classList.remove("detected");
      });
    });
  </script>
</body>

</html>
