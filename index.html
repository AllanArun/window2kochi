<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Window2Kochi - WebAR Experience</title>

  <!-- 1. Diagnostic Console & Camera Stream Interceptors (Must run before all libraries) -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
    }

    /* Container for MindAR camera feed & WebGL scene */
    .example-container {
      overflow: hidden;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    /* Ensure video is visible right behind the transparent WebGL canvas */
    video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .a-canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
    }

    /* Mobile Debug Console */
    #mobile-debug-console {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      max-height: 30vh;
      background: rgba(0, 0, 0, 0.85);
      color: #00ff66;
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.4;
      z-index: 999999;
      overflow-y: auto;
      padding: 8px 12px;
      pointer-events: auto;
      box-sizing: border-box;
      border-bottom: 2px solid rgba(0, 255, 102, 0.4);
      transition: max-height 0.2s ease;
    }

    #mobile-debug-console.minimized {
      max-height: 26px;
      overflow: hidden;
    }

    .debug-error {
      color: #ff4d4d;
      font-weight: bold;
    }

    .debug-warn {
      color: #ffaa00;
    }

    /* UI Overlay */
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 34px; /* clearance for debug header */
      pointer-events: auto;
    }

    .badge {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .sound-btn, .cam-btn {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .status-card.detected {
      background: rgba(46, 204, 113, 0.85);
      border-color: rgba(46, 204, 113, 0.4);
    }
  </style>

  <script>
    // Global Debug Screen Logger
    window.logQueue = [];
    window.printToScreen = function (msg, type = '') {
      const consoleEl = document.getElementById('mobile-debug-console');
      let text = (typeof msg === 'object' && msg !== null) ? (msg.stack || JSON.stringify(msg)) : String(msg);
      if (!consoleEl) {
        window.logQueue.push({ text, type });
        return;
      }
      const line = document.createElement('div');
      line.textContent = `> ${text}`;
      if (type === 'error') line.className = 'debug-error';
      if (type === 'warn') line.className = 'debug-warn';
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    };

    const _origLog = console.log;
    const _origWarn = console.warn;
    const _origErr = console.error;

    console.log = function (...args) { printToScreen(args.join(' ')); _origLog.apply(console, args); };
    console.warn = function (...args) { printToScreen(args.join(' '), 'warn'); _origWarn.apply(console, args); };
    console.error = function (...args) { printToScreen(args.join(' '), 'error'); _origErr.apply(console, args); };

    window.onerror = function (m, s, l) { printToScreen(`CRASH: ${m} (line ${l})`, 'error'); return false; };
    window.addEventListener('unhandledrejection', e => printToScreen(`PROMISE REJECT: ${e.reason}`, 'error'));

    // Intercept getUserMedia: add logging + fallback for devices without environment camera
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const origGUM = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = async function (constraints) {
        console.log("Camera requested:", JSON.stringify(constraints));
        try {
          const stream = await origGUM(constraints);
          console.log("Camera access granted! Active tracks:", stream.getVideoTracks().length);
          return stream;
        } catch (err) {
          console.warn("Primary camera request failed (" + err.name + "). Retrying fallback...");
          try {
            const fallbackStream = await origGUM({ video: true, audio: false });
            console.log("Fallback camera granted!");
            return fallbackStream;
          } catch (fallbackErr) {
            console.error("Camera completely denied:", fallbackErr.name, fallbackErr.message);
            throw fallbackErr;
          }
        }
      };
    } else {
      console.error("navigator.mediaDevices.getUserMedia is NOT supported in this browser!");
    }

    // Intercept HTMLMediaElement.srcObject: Immediately call play() to prevent iOS WebKit stall
    const mediaProto = HTMLMediaElement.prototype;
    const srcObjectDesc = Object.getOwnPropertyDescriptor(mediaProto, 'srcObject') ||
                          Object.getOwnPropertyDescriptor(HTMLVideoElement.prototype, 'srcObject');

    if (srcObjectDesc && srcObjectDesc.set) {
      const origSet = srcObjectDesc.set;
      Object.defineProperty(mediaProto, 'srcObject', {
        set(stream) {
          origSet.call(this, stream);
          if (stream && this.tagName === 'VIDEO') {
            this.setAttribute('playsinline', '');
            this.setAttribute('webkit-playsinline', '');
            this.playsInline = true;
            this.muted = true;
            console.log("Video srcObject assigned! Triggering play()...");
            this.play().then(() => {
              console.log("Camera video stream is actively PLAYING!");
            }).catch(e => {
              console.warn("video.play() deferred by browser:", e.message);
            });
          }
        },
        get() {
          return srcObjectDesc.get.call(this);
        }
      });
    }
  </script>

  <!-- 2. A-Frame and MindAR Scripts -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <!-- Debug Console Display -->
  <div id="mobile-debug-console" title="Tap to expand/collapse">
    <div style="font-size: 10px; color: #888; margin-bottom: 4px;">[Debug Console - tap to toggle]</div>
  </div>

  <script>
    const debugConsole = document.getElementById('mobile-debug-console');
    debugConsole.addEventListener('click', () => {
      debugConsole.classList.toggle('minimized');
    });
    // Flush queued logs
    if (window.logQueue && window.logQueue.length) {
      window.logQueue.forEach(item => window.printToScreen(item.text, item.type));
      window.logQueue = [];
    }
  </script>

  <!-- UI Overlay -->
  <div id="ui-container">
    <div class="top-bar">
      <div class="badge">Window2Kochi AR</div>
      <div style="display: flex; gap: 8px;">
        <button id="camRetry" class="cam-btn" title="Retry Camera">📷 Restart</button>
        <button id="soundToggle" class="sound-btn" title="Toggle Sound">🔊</button>
      </div>
    </div>
    <div class="bottom-bar">
      <div id="statusMessage" class="status-card">Point camera at target image</div>
    </div>
  </div>

  <!-- MindAR official container wrapper -->
  <div class="example-container">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="arTarget" mindar-image-target="targetIndex: 0">
        <a-box position="0 0 0.1" scale="0.5 0.5 0.5" color="red"></a-box>
      </a-entity>
    </a-scene>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("a-scene");
      const targetEntity = document.querySelector("#arTarget");
      const statusMessage = document.querySelector("#statusMessage");
      const soundBtn = document.querySelector("#soundToggle");
      const camRetryBtn = document.querySelector("#camRetry");
      let audioEnabled = true;

      // MindAR Lifecycle Watchers
      sceneEl.addEventListener("renderstart", () => {
        console.log("A-Frame scene render started");
      });

      sceneEl.addEventListener("arReady", () => {
        console.log("MindAR engine ready: Camera & tracking online!");
      });

      sceneEl.addEventListener("arError", (event) => {
        console.error("MindAR arError:", JSON.stringify(event.detail || event));
      });

      // Safety Guard: if MindAR didn't autostart on renderstart, trigger it once loaded
      sceneEl.addEventListener("loaded", () => {
        console.log("A-Frame scene loaded");
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem && !arSystem.video) {
          console.log("MindAR not yet started. Calling arSystem.start()...");
          arSystem.start();
        }
      });

      // Manual camera restart button (user gesture trigger for strict mobile browser policies)
      camRetryBtn.addEventListener("click", () => {
        console.log("Manual camera trigger clicked");
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) {
          if (arSystem.video) {
            arSystem.video.play().then(() => console.log("Video resumed via click")).catch(e => console.error("Play error:", e));
          } else {
            arSystem.start();
          }
        }
      });

      soundBtn.addEventListener("click", () => {
        audioEnabled = !audioEnabled;
        soundBtn.textContent = audioEnabled ? "🔊" : "🔇";
      });

      targetEntity.addEventListener("targetFound", () => {
        console.log("Target 0 DETECTED!");
        statusMessage.textContent = "Target detected!";
        statusMessage.classList.add("detected");
      });

      targetEntity.addEventListener("targetLost", () => {
        console.log("Target 0 lost");
        statusMessage.textContent = "Point camera at target image";
        statusMessage.classList.remove("detected");
      });
    });
  </script>
</body>

</html>
