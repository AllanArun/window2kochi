<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Window2Kochi - WebAR Experience</title>

  <!-- A-Frame and MindAR MUST be loaded in head -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent !important;
    }

    /* Official MindAR Container: required for correct camera & canvas stacking */
    .example-container {
      overflow: hidden;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    /* Mobile Debug Console */
    #mobile-debug-console {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      max-height: 25vh;
      background: rgba(0, 0, 0, 0.75);
      color: #00ff00;
      font-family: monospace;
      font-size: 11px;
      z-index: 999999;
      overflow-y: auto;
      padding: 8px 12px;
      pointer-events: auto;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(0, 255, 0, 0.3);
      transition: max-height 0.2s ease;
    }

    #mobile-debug-console.minimized {
      max-height: 24px;
      overflow: hidden;
    }

    .debug-error {
      color: #ff4444;
      font-weight: bold;
    }

    .debug-warn {
      color: #ffbb33;
    }

    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px; /* offset for debug header */
      pointer-events: auto;
    }

    .badge {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .sound-btn {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s, transform 0.2s;
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .status-card.detected {
      background: rgba(46, 204, 113, 0.85);
      border-color: rgba(46, 204, 113, 0.4);
    }
  </style>

  <script>
    // iOS / Safari stream watchdog: forces muted video playback on stream attach
    const streamObserver = new MutationObserver((mutations) => {
      for (const m of mutations) {
        for (const node of m.addedNodes) {
          if (node.tagName === 'VIDEO') {
            node.setAttribute('playsinline', '');
            node.setAttribute('webkit-playsinline', '');
            node.playsInline = true;
            node.muted = true;

            const kickstartVideo = () => {
              if (node.srcObject && node.paused) {
                node.play().then(() => {
                  console.log("Camera video stream actively playing (" + node.videoWidth + "x" + node.videoHeight + ")");
                }).catch(err => {
                  console.warn("Video play trigger deferred:", err);
                });
              }
            };

            node.addEventListener('loadedmetadata', kickstartVideo);
            node.addEventListener('loadeddata', kickstartVideo);
            node.addEventListener('canplay', kickstartVideo);
            if (node.srcObject) kickstartVideo();
          }
        }
      }
    });
    streamObserver.observe(document.documentElement, { childList: true, subtree: true });
  </script>
</head>

<body>
  <!-- Mobile Debug Console (Tap to toggle minimize) -->
  <div id="mobile-debug-console" title="Tap to expand/collapse">
    <div style="font-size: 10px; color: #888; margin-bottom: 4px;">[Console Log - tap to toggle]</div>
  </div>

  <script>
    (function () {
      const debugConsole = document.getElementById('mobile-debug-console');
      debugConsole.addEventListener('click', () => {
        debugConsole.classList.toggle('minimized');
      });

      function printToScreen(msg, type = '') {
        const logLine = document.createElement('div');
        let output = (typeof msg === 'object' && msg !== null) ? (msg.stack || JSON.stringify(msg)) : msg;
        logLine.textContent = `> ${output}`;
        if (type === 'error') logLine.className = 'debug-error';
        if (type === 'warn') logLine.className = 'debug-warn';
        debugConsole.appendChild(logLine);
        debugConsole.scrollTop = debugConsole.scrollHeight;
      }

      const originalError = console.error;
      console.error = function (...args) { printToScreen(args.join(' '), 'error'); originalError.apply(console, args); };
      const originalLog = console.log;
      console.log = function (...args) { printToScreen(args.join(' ')); originalLog.apply(console, args); };
      const originalWarn = console.warn;
      console.warn = function (...args) { printToScreen(args.join(' '), 'warn'); originalWarn.apply(console, args); };

      window.onerror = function (m, s, l) { printToScreen(`CRASH: ${m} at line ${l}`, 'error'); return false; };
      window.addEventListener('unhandledrejection', e => printToScreen(`PROMISE FAIL: ${e.reason}`, 'error'));
    })();
  </script>

  <div id="ui-container">
    <div class="top-bar">
      <div class="badge">Window2Kochi AR</div>
      <button id="soundToggle" class="sound-btn" title="Toggle Sound">🔊</button>
    </div>
    <div class="bottom-bar">
      <div id="statusMessage" class="status-card">Point camera at target image</div>
    </div>
  </div>

  <!-- MindAR official container wrapper -->
  <div class="example-container">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="arTarget" mindar-image-target="targetIndex: 0">
        <a-box position="0 0 0.1" scale="0.5 0.5 0.5" color="red"></a-box>
      </a-entity>
    </a-scene>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("a-scene");
      const targetEntity = document.querySelector("#arTarget");
      const statusMessage = document.querySelector("#statusMessage");
      const soundBtn = document.querySelector("#soundToggle");
      let audioEnabled = true;

      sceneEl.addEventListener("renderstart", () => {
        console.log("A-Frame scene render started");
      });

      sceneEl.addEventListener("arReady", () => {
        console.log("MindAR engine ready: Camera feed active");
      });

      sceneEl.addEventListener("arError", (event) => {
        console.error("MindAR error:", JSON.stringify(event.detail || event));
      });

      soundBtn.addEventListener("click", () => {
        audioEnabled = !audioEnabled;
        soundBtn.textContent = audioEnabled ? "🔊" : "🔇";
      });

      targetEntity.addEventListener("targetFound", () => {
        console.log("Target 0 found!");
        statusMessage.textContent = "Target detected!";
        statusMessage.classList.add("detected");
      });

      targetEntity.addEventListener("targetLost", () => {
        console.log("Target 0 lost");
        statusMessage.textContent = "Point camera at target image";
        statusMessage.classList.remove("detected");
      });
    });
  </script>
</body>

</html>
