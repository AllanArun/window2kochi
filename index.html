<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Window2Kochi - WebAR Experience</title>

  <!-- A-Frame and MindAR MUST be loaded first in the head -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Fixed typo from the previous CSS: changed `- {` to `* {` */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent;
    }

    #mobile-debug-console {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 35vh;
      background: rgba(0, 0, 0, 0.85);
      color: #00ff00;
      font-family: monospace;
      font-size: 12px;
      z-index: 999999;
      overflow-y: scroll;
      padding: 10px;
      pointer-events: none;
      box-sizing: border-box;
    }

    .debug-error {
      color: #ff4444;
    }

    .debug-warn {
      color: #ffbb33;
    }

    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .badge {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .sound-btn {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s, transform 0.2s;
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .status-card.detected {
      background: rgba(46, 204, 113, 0.85);
      border-color: rgba(46, 204, 113, 0.4);
    }
  </style>
</head>

<body>
  <!-- Debug Console Injection -->
  <div id="mobile-debug-console"></div>
  <script>
    (function () {
      const debugConsole = document.getElementById('mobile-debug-console');
      function printToScreen(msg, type = '') {
        const logLine = document.createElement('div');
        let output = (typeof msg === 'object' && msg !== null) ? (msg.stack || JSON.stringify(msg)) : msg;
        logLine.textContent = `> ${output}`;
        if (type === 'error') logLine.className = 'debug-error';
        if (type === 'warn') logLine.className = 'debug-warn';
        debugConsole.appendChild(logLine);
        debugConsole.scrollTop = debugConsole.scrollHeight;
      }
      const originalError = console.error;
      console.error = function (...args) { printToScreen(args.join(' '), 'error'); originalError.apply(console, args); };
      const originalLog = console.log;
      console.log = function (...args) { printToScreen(args.join(' ')); originalLog.apply(console, args); };
      window.onerror = function (m, s, l) { printToScreen(`CRASH: ${m} at line ${l}`, 'error'); return false; };
      window.addEventListener('unhandledrejection', e => printToScreen(`PROMISE FAIL: ${e.reason}`, 'error'));
    })();
  </script>

  <div id="ui-container">
    <div class="top-bar">
      <div class="badge">Window2Kochi AR</div>
      <button id="soundToggle" class="sound-btn" title="Toggle Sound">🔊</button>
    </div>
    <div class="bottom-bar">
      <div id="statusMessage" class="status-card">Point camera at target image</div>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- THE FIX: The <a-assets> block has been removed. The screenshot showed the engine hitting a 3000ms timeout trying to load the empty model.glb and audio.mp3 files, which crashed the camera sequence. -->

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="arTarget" mindar-image-target="targetIndex: 0">
      <a-box position="0 0 0.1" scale="0.5 0.5 0.5" color="red"></a-box>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#arTarget");
      const statusMessage = document.querySelector("#statusMessage");
      const soundBtn = document.querySelector("#soundToggle");
      let audioEnabled = true;

      soundBtn.addEventListener("click", () => {
        audioEnabled = !audioEnabled;
        soundBtn.textContent = audioEnabled ? "🔊" : "🔇";
      });

      targetEntity.addEventListener("targetFound", () => {
        statusMessage.textContent = "Target detected!";
        statusMessage.classList.add("detected");
      });

      targetEntity.addEventListener("targetLost", () => {
        statusMessage.textContent = "Point camera at target image";
        statusMessage.classList.remove("detected");
      });
    });
  </script>
</body>

</html>
