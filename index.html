<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Window2Kochi - WebAR Experience</title>

  <!-- A-Frame library -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking for A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
    }

    /* UI Overlay */
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .badge {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .sound-btn {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s, transform 0.2s;
    }

    .sound-btn:active {
      transform: scale(0.95);
    }

    /* Bottom Prompt */
    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    .status-card {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .status-card.detected {
      background: rgba(46, 204, 113, 0.85);
      color: #fff;
      border-color: rgba(46, 204, 113, 0.4);
    }
  </style>
</head>
<body>
  <!-- UI Layer -->
  <div id="ui-container">
    <div class="top-bar">
      <div class="badge">Window2Kochi AR</div>
      <button id="soundToggle" class="sound-btn" title="Toggle Sound">🔊</button>
    </div>
    <div class="bottom-bar">
      <div id="statusMessage" class="status-card">Point camera at target image</div>
    </div>
  </div>

  <!-- A-Frame Scene with MindAR -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <!-- Asset Preloading -->
    <a-assets>
      <a-asset-item id="kochiModel" src="./model.glb"></a-asset-item>
      <audio id="kochiAudio" src="./audio.mp3" preload="auto"></audio>
    </a-assets>

    <!-- AR Camera -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0: Associated with index 0 in targets.mind -->
    <a-entity id="arTarget" mindar-image-target="targetIndex: 0">
      <!-- 3D Model: adjust position, rotation, and scale as needed -->
      <a-gltf-model 
        id="arModel"
        src="#kochiModel" 
        position="0 0 0" 
        rotation="0 0 0" 
        scale="0.1 0.1 0.1">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#arTarget");
      const audio = document.querySelector("#kochiAudio");
      const soundBtn = document.querySelector("#soundToggle");
      const statusMessage = document.querySelector("#statusMessage");

      let audioEnabled = true;

      // Handle user gesture to unlock audio on mobile browsers
      soundBtn.addEventListener("click", () => {
        audioEnabled = !audioEnabled;
        soundBtn.textContent = audioEnabled ? "🔊" : "🔇";
        if (!audioEnabled) {
          audio.pause();
        }
      });

      // Target Detected Event
      targetEntity.addEventListener("targetFound", () => {
        statusMessage.textContent = "Target detected!";
        statusMessage.classList.add("detected");

        if (audioEnabled) {
          audio.play().catch((err) => {
            console.log("Audio play blocked by browser policy until user interacts:", err);
          });
        }
      });

      // Target Lost Event
      targetEntity.addEventListener("targetLost", () => {
        statusMessage.textContent = "Point camera at target image";
        statusMessage.classList.remove("detected");
        audio.pause();
      });
    });
  </script>
</body>
</html>
